  Choice Fatigue:
    smart_filter:
      limit: 5
      all:
        unplayed: true
        release: 3650
        genre.not: Horror
        audience_rating.gte: 6
      sort_by: random
    sort_title: "!Choice Fatigue"
    collection_filtering: user
    summary: "Can't decide what to watch? Here are a few popular selections released in the last decade."

  Unwatched:
    smart_filter:
      all:
        unplayed: true
      sort_by: random
    sort_title: "!Unwatched"
    collection_filtering: user

  Non-English:
    smart_filter:
      any:
        audio_language.not:
          - English
      sort_by: title.asc
    sort_title: "zzzNon-English"
    summary: "You're gonna need to be okay with subtitles."

  Recently Added Movies:
    smart_filter:
      limit: 100
      all:
        added: 60      # added within this many days
        label.not:
          - "Exclude From Recent"
      sort_by: added.desc
    sort_title: "zzRecent"
    summary: "Here's what's been added to Plex within the last couple months."
    collection_mode: hide

  Asylum:
    smart_filter:
      all:
        studio.is: "The Asylum"
      sort_by: title.asc
    summary: "Cinematic masterpieces produced by low-budget powerhouse studio 'The Asylum'. So bad it's... still bad."

