## Smart Filters/Builders
## Dynamically generated rather than defined lists of specific titles



  Highly Recommended:
    tmdb_list:
      - https://www.themoviedb.org/list/8677897-highly-recommended
    sync_mode: sync
    smart_label:
      sort_by: title.asc
      all:
        label: <<smart_label>>
        label.not: "Alt Edition"
    sort_title: ":Highly Recommended"

